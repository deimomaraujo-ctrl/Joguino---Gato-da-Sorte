<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gato da Sorte - Plataforma Oficial</title>
    <style>
        :root {
            --primary-color: #059669;
            --primary-dark: #047857;
            --accent-gold: #fbbf24;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--primary-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .card h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        /* Painel Administrativo / Logado */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 1000px;
        }

        .admin-panel {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat-card {
            background-color: rgba(15, 23, 42, 0.7);
            padding: 1.25rem;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
        }

        .stat-card h3 {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .stat-card p {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 0.5rem;
        }

        .hidden {
            display: none !important;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background-color: #ef4444;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>🐱</span>
            <h1>Gato da Sorte</h1>
        </div>
        <div id="header-user-section" class="hidden">
            <div class="user-info">
                <span>Painel do Administrador</span>
                <button class="logout-btn" onclick="fazerLogout()">Sair</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="login-card" class="card">
            <h2>Acesso Restrito</h2>
            <div class="form-group">
                <label for="username">Usuário Administrador</label>
                <input type="text" id="username" placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label for="password">Senha de Acesso</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn" onclick="fazerLogin()">Entrar no Sistema</button>
        </div>

        <!-- TELA DE USUÁRIO LOGADO / PAINEL ADMINISTRATIVO -->
        <div id="dashboard-card" class="dashboard hidden">
            <div class="admin-panel">
                <h2>Painel de Controle Principal (Admin)</h2>
                <p style="color: var(--text-muted);">Bem-vindo ao núcleo de gerenciamento da plataforma Gato da Sorte. Você possui controle total sobre as operações.</p>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Usuários Ativos</h3>
                        <p>1,248</p>
                    </div>
                    <div class="stat-card">
                        <h3>Saldo em Caixa</h3>
                        <p style="color: var(--accent-gold);">R$ 45.890,00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Status da API</h3>
                        <p style="color: var(--primary-color);">Online</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Scripts integrados e adaptados para o seu controle administrativo total
        function fazerLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Validação simples de exemplo para o seu acesso administrativo
            if(user.trim() !== "" && pass.trim() !== "") {
                // Oculta tela de login e exibe o dashboard administrativo
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('dashboard-card').classList.remove('hidden');
                document.getElementById('header-user-section').classList.remove('hidden');
            } else {
                alert("Por favor, preencha os dados de acesso.");
            }
        }

        function fazerLogout() {
            // Retorna à tela inicial de login
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('header-user-section').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
